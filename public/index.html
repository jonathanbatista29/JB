<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JB IHM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">JB<span>IHM</span></div>
    <nav class="tabs" id="tabs">
      <button data-page="runtime" class="active">▶ Operação</button>
      <button data-page="editor">✎ Editor de Telas</button>
      <button data-page="tags">🏷 Tags</button>
      <button data-page="connections">🔌 PLCs</button>
      <button data-page="gateway">🔀 Gateway</button>
      <button data-page="alarms">🔔 Alarmes</button>
      <button data-page="history">📊 Histórico</button>
      <button data-page="users">👥 Usuários</button>
    </nav>
    <div class="top-actions">
      <span id="connSummary" class="conn-summary"></span>
      <span id="dirtyFlag" class="dirty hidden">● não salvo</span>
      <button id="btnSave" class="btn primary" title="Salvar (Ctrl+S)">💾 Salvar</button>
      <div id="userBox"></div>
      <div class="menu">
        <button class="btn" id="btnMenu">⋮</button>
        <div class="menu-list hidden" id="menuList">
          <button id="btnExport">Exportar projeto (.json)</button>
          <button id="btnImport">Importar projeto (.json)</button>
          <button id="btnFullscreen">Tela cheia</button>
        </div>
      </div>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section id="page-runtime" class="page active"></section>
    <section id="page-editor" class="page"></section>
    <section id="page-tags" class="page"></section>
    <section id="page-connections" class="page"></section>
    <section id="page-gateway" class="page"></section>
    <section id="page-alarms" class="page"></section>
    <section id="page-history" class="page"></section>
    <section id="page-users" class="page"></section>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
